backbone: openbmb/MiniCPM-o-2_6

grounding:
  data: data/vggsound_train.parquet
  out: checkpoints/minicpm_grounding/adapter
  lora_r: 32
  lora_alpha: 16
  target_modules: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
  lr: 5.0e-5
  epochs: 1
  accum: 8
  seed: 0

conf_lora:
  data: data/minicpm_conftarget.parquet
  init: checkpoints/minicpm_grounding/adapter
  out: checkpoints/minicpm_conf/adapter
  lr: 5.0e-5
  epochs: 1

eval:
  protocol: decoupled
  answer_from: grounding
  confidence_from: conf_lora
  frames: 8
  avhbench: data/avhbench_eval.parquet
  cmm: data/cmm_eval.parquet

expected_avhbench:
  acc: 0.838
  auroc: 0.695
  ece: 0.080
  n: 5302
